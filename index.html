<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Unsub 日本語マニュアル</title>
  <meta name="description" content="Unsub 日本語版ドキュメント">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify-themeable@0/dist/css/theme-simple.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify-sidebar-collapse/dist/sidebar.min.css">
  <style>
    :root {
      --base-font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif;
      --base-font-size: 15px;
      --theme-color: #1a73e8;
      --sidebar-width: 280px;
      --sidebar-nav-link-color--active: #1a73e8;
      --sidebar-name-font-weight: bold;
    }

    /* Hide sidebar-collapse plugin's left-side arrow */
    .sidebar-nav ul:not(.app-sub-sidebar) > li:not(.file)::before {
      display: none !important;
    }

    /* Right-side arrow for folder items */
    .sidebar-nav ul:not(.app-sub-sidebar) > li:not(.file) > a {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .sidebar-nav ul:not(.app-sub-sidebar) > li:not(.file) > a::after {
      content: '';
      display: inline-block;
      width: 6px;
      height: 6px;
      border-right: 1.5px solid #9ca3af;
      border-bottom: 1.5px solid #9ca3af;
      transform: rotate(-45deg);
      flex-shrink: 0;
      margin-left: 8px;
      transition: transform 0.15s ease;
    }
    .sidebar-nav ul:not(.app-sub-sidebar) > li.open > a::after,
    .sidebar-nav ul:not(.app-sub-sidebar) > li.active > a::after {
      transform: rotate(45deg);
      border-color: var(--theme-color);
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    window.$docsify = {
      name: 'Unsub 日本語マニュアル',
      repo: 'https://github.com/KKasama/Unsub_Japanese_Docs',
      loadSidebar: '_sidebar.md',
      subMaxLevel: 0,
      search: {
        placeholder: '検索',
        noData: '結果が見つかりません',
        depth: 3
      },
      auto2top: true,
      coverpage: false,
      notFoundPage: true,
      requestHeaders: {
        'Cache-Control': 'no-cache'
      },
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-sidebar-collapse/dist/docsify-sidebar-collapse.min.js"></script>
</body>
</html>
